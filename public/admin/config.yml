          TW 控制前台公開：勾選表示下架／未公開。CMS 的 Save Draft 只儲存審核分支；Publish 合併 main 後，仍需取消此勾選並完成三語及 CI 才會在官網顯示。
          共用結構：於繁體中文設定，修改時同步三語。 / Shared structure: edit in Traditional Chinese to update all languages.
