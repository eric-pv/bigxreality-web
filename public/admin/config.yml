  - name: news-media
    label: 新聞共用圖集與影片（進階） / News Media Registry (Advanced)
    files:
      - name: registry
        label: 新聞媒體資料 / News Media Data
        file: src/data/news-media.json
        format: bxr-media-json
        fields:
          - name: body
            label: 媒體對應表 / Media Map
            widget: bxr-value
            required: true
            value_schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  publicationDate:
                    anyOf:
                      - type: string
                        pattern: ^\d{4}-\d{2}-\d{2}$
                      - type: "null"
                  cover: &a17
                    type: object
                    required:
                      - filename
                      - approved
                    properties:
                      filename:
                        type: string
                        pattern: ^[a-z0-9-]+\.(jpg|jpeg|png)$
                      approved:
                        type: boolean
                      alt: &a16
                        type: object
                        properties:
                          tw:
                            type: string
                          en:
                            type: string
                          jp:
                            type: string
                        additionalProperties: false
                      caption: *a16
                    additionalProperties: false
                  gallery:
                    type: array
                    items: *a17
                  videos:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - url
                      properties:
                        type:
                          enum:
                            - youtube
                            - facebook
                            - local
                        url:
                          type: string
                          pattern: ^(https://|/media/news/)
                        embedApproved:
                          type: boolean
                        approved:
                          type: boolean
                        title: *a16
                        poster:
                          type: string
                      additionalProperties: false
                  sourceLinks:
                    type: array
                    items:
                      type: string
                      pattern: ^https://
                additionalProperties: false
            hint: 完整沿用現有 mediaId→媒體物件。圖檔在 src/assets/images/news/，filename 只填檔名；approved=true 且三語 alt 完整才顯示。
