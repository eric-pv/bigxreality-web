# Generated by npm run cms:sveltia:generate from src/content.config.ts. Do not hand-edit.
backend:
  name: github
  repo: eric-pv/bigxreality-web
  branch: main
  auth_methods:
    - token
publish_mode: editorial_workflow
output:
  omit_empty_optional_fields: true
site_url: https://eric-pv.github.io/bigxreality-web/
display_url: https://eric-pv.github.io/bigxreality-web/
media_folder: src/assets/images/news
public_folder: /src/assets/images/news
asset_collections:
  - name: news-images
    label: 新聞圖片 / News Images
    media_folder: src/assets/images/news
    public_folder: /src/assets/images/news
  - name: product-images
    label: 產品與解決方案圖片 / Product and Solution Images
    media_folder: src/assets/images/products
    public_folder: /src/assets/images/products
  - name: content-images
    label: 一般內容圖片 / Content Images
    media_folder: src/assets/images/content
    public_folder: /src/assets/images/content
  - name: news-videos
    label: 新聞本地影片 / Local News Videos
    media_folder: public/media/news
    public_folder: /media/news
media_libraries:
  default:
    config:
      max_file_size: 20000000
      slugify_filename: true
      filename_template: "{{filename}}-{{uuid_short}}"
collections:
  - name: news-tw
    label: TW · 最新消息 / News
    folder: src/content/news/tw
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}}"
    media_folder: /src/assets/images/news
    public_folder: ../../../assets/images/news
    fields:
      - name: translationStatus
        label: 翻譯狀態 / Translation Status
        required: true
        widget: select
        options: &a7
          - label: 原文 / Source Language
            value: source
          - label: 待完成 / Pending
            value: pending
          - label: 已完成翻譯 / Translated
            value: translated
        default: source
      - &a8
        name: draft
        label: 尚未公開 / Unpublished Draft
        required: false
        default: true
        widget: boolean
        hint: TW 控制前台公開：勾選表示下架／未公開。CMS 的 Save Draft 只儲存審核分支；Publish 合併 main 後，仍需取消此勾選並完成三語及 CI 才會在官網顯示。
      - &a9
        name: publishDate
        label: 發布日期 / Publish Date
        required: false
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - &a10
        name: updatedAt
        label: 更新日期 / Updated Date
        required: false
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - &a11
        name: title
        label: 標題 / Title
        required: true
        widget: string
      - &a12
        name: summary
        label: 摘要 / Summary
        required: true
        widget: text
      - &a13
        name: cover
        label: 封面 / Cover
        required: false
        widget: object
        collapsed: true
        fields:
          - name: src
            label: 圖片檔案 / Image File
            required: true
            widget: image
            multiple: false
            choose_url: false
          - name: alt
            label: 替代文字 / Alternative Text
            required: true
            widget: string
      - &a14
        name: tags
        label: 文章標籤 / Tags
        required: false
        default: []
        widget: relation
        collection: tags-tw
        value_field: "{{slug}}"
        search_fields: &a1
          - name
        display_fields: *a1
        multiple: true
        dropdown_threshold: 0
        hint: 搜尋名稱後選取；實際儲存英文代稱（slug）。 / Search by name; the slug is stored.
