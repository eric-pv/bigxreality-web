# Generated by npm run cms:sveltia:generate from src/content.config.ts. Do not hand-edit.
backend:
  name: github
  repo: eric-pv/bigxreality-web
  branch: main
  auth_methods:
    - token
i18n:
  structure: multiple_folders
  locales:
    - zh-Hant
    - en
    - ja
  default_locale: zh-Hant
  initial_locales: all
publish_mode: editorial_workflow
output:
  omit_empty_optional_fields: true
site_url: https://eric-pv.github.io/bigxreality-web/
display_url: https://eric-pv.github.io/bigxreality-web/
media_folder: src/assets/images/news
public_folder: /src/assets/images/news
asset_collections:
  - name: news-images
    label: 新聞圖片 / News Images
    media_folder: src/assets/images/news
    public_folder: /src/assets/images/news
  - name: product-images
    label: 產品與解決方案圖片 / Product and Solution Images
    media_folder: src/assets/images/products
    public_folder: /src/assets/images/products
  - name: content-images
    label: 一般內容圖片 / Content Images
    media_folder: src/assets/images/content
    public_folder: /src/assets/images/content
  - name: news-videos
    label: 新聞本地影片 / Local News Videos
    media_folder: public/media/news
    public_folder: /media/news
media_libraries:
  default:
    config:
      max_file_size: 20000000
      slugify_filename: true
      filename_template: "{{filename}}-{{uuid_short}}"
collections:
  - name: technologies
    label: 核心技術全文 / Core Technology Pages
