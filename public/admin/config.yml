    fields:
      - name: heroImage
        label: 頁首圖片 / Hero Image
        required: false
        widget: object
        collapsed: true
        fields:
          - name: src
            label: 圖片檔案 / Image File
            required: true
            widget: image
            multiple: false
            choose_url: false
            i18n: true
          - name: alt
            label: 替代文字 / Alternative Text
            required: true
            widget: string
            i18n: true
        i18n: true
      - name: translationStatus
        label: 翻譯狀態 / Translation Status
        required: true
        widget: select
        options:
          - label: 原文 / Source Language
            value: source
          - label: 待完成 / Pending
            value: pending
          - label: 已完成翻譯 / Translated
            value: translated
        default: source
        i18n: true
        default_localized:
          zh-Hant: source
          en: pending
          ja: pending
      - name: draft
        label: 尚未公開 / Unpublished Draft
        required: false
