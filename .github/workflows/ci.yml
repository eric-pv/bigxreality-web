name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      BXR_CONTENT_SOURCE: markdown
      BXR_PREVIEW: "0"
    steps:
      # Shallow checkout: the build needs only HEAD. The CMS media guard (sveltia/check.mjs)
      # diffs against origin/main on cms/* branches, so only that ref is fetched (depth 1).
      - uses: actions/checkout@v7
      - name: Fetch main for the CMS media guard
        if: github.ref != 'refs/heads/main'
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Sveltia schema and content compatibility
        run: npm run cms:sveltia:check
      - name: Sveltia real-browser isolated editing
        run: npm run qa:sveltia
      - name: Inquiry transport harness (mock only, not Google acceptance)
        run: npm run qa:inquiry-poc
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx astro check
      # Astro's optimised-image cache only (not the content data store). Entries are keyed by
      # source hash + transform, so a hit yields byte-identical images; a lockfile change
      # (Astro/sharp upgrade) starts a fresh cache. Only main saves it; PRs restore main's cache.
      - name: Restore Astro image cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.astro/assets
          key: astro-assets-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/assets/**', 'astro.config.mjs') }}
          restore-keys: astro-assets-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # Git main is the only official content source. No remote CMS is queried.
      - name: Build
        run: npm run build
      - name: Save Astro image cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: node_modules/.astro/assets
          key: astro-assets-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/assets/**', 'astro.config.mjs') }}
        continue-on-error: true
      - name: Production inquiry form (mock Google only; no real writes)
        run: npm run qa:inquiry-production
      - run: npm run qa:technologies
      - run: npm run qa:news-preview
      - run: npm run qa:news-media
      - run: npm run qa:csr
      - run: npm run qa:news-import
      # Screenshot/layout/motion QA (~18 min) runs in qa-full.yml and does not delay publishing.
      - run: npm run qa:client-logos
      - run: npm run qa:images
      - run: npm run qa:seo
      - run: npm run check:sitemap
      - run: npm run qa:links
      - run: npm run qa:behaviour
      - run: npm run qa:header
      - run: npm run qa:footer
      - run: npm run qa:solutions
      - run: npm run qa:company
      - run: npm run qa:team
      - run: npm run qa:english
      - run: npm run qa:japanese
      - run: npm run qa:faq
      # TEST FIXTURE content: pages, search and accessibility of phase 2 templates
      - name: Build test fixtures
        run: npm run build:fixtures
      - run: QA_DIST=dist-fixtures npm run qa:technologies
      - run: npm run qa:phase2
      - run: QA_DIST=dist-fixtures npm run qa:company
      - run: npm run qa:search
      - run: QA_DIST=dist-fixtures npm run qa:a11y -- /tw/solutions/police/ /tw/news/ /tw/news/fixture-news-02/ /tw/cases/fixture-case-1/ /tw/tags/xr-training/ /tw/search/
      - name: Package the verified Pages artifact
        run: npm run pages:package && npm run pages:check
      - name: Publish build summary
        if: always()
        run: |
          echo "## BXR website" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "CMS target: main; source: Git Markdown; hosting: GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages publication requires every build-and-test step to pass." >> "$GITHUB_STEP_SUMMARY"
      # v5 wraps upload-artifact v7 (Node 24). Since v4 it drops dotfiles by default; keep the
      # packager's .nojekyll so the artifact contents stay identical to what pages:check verified.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist-pages
          include-hidden-files: true
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
